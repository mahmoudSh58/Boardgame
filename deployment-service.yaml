---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
  namespace: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: boardgame
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      containers:
        - image:  ${IMAGE_NAME}
          name: boardgame-container
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: boardgame-service
  namespace: myapp
spec:
  selector:
    app: boardgame
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
