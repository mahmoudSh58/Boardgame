name: Boardgame CI
on:
  push:
    branches: [ "main", "agent_test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK - 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build artifact
        run: ./mvnv -B -DskipTests clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
      - name: Run tests
        run: ./mvnv -B test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-actionp@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: boardgame:#{{ github.sha }}