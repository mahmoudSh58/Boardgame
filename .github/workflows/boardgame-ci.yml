name: Boardgame CI

on:
  push:
    branches: ["main", "agent_test"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Fix mvnw line endings (if CRLF)
        run: |
           if command -v dos2unix >/dev/null 2>&1; then dos2unix mvnw || :
           sudo apt-get update && sudo apt-get install y dos2unix && dos2unix mvnw || true
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build artifact
        run: ./mvnw -B -DskipTests clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
      - name: Run tests
        run: ./mvnw -B test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: boardgame:#{{ github.sha }}
