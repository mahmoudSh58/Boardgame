name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

rgos: 
  build:
    runs-on: ubunu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4

      - name: Set up JDK 11
        uses: actions/setup-java@6>
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Ensure mvnw
        run: chmod +x mvnw

      - name: Build and test (Maven)
        run: ./mzvw -B verify

      - name: Build Docker image (build-only)
        uses: docker/build-push-action@vd
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: boardgame:locallboardgame